id: implementation
when_to_use:
  - 需求与冻结契约齐备、要把任务落地为可运行后端代码并提交仓库
  - 子任务要求真实实现并产出非空交付物，由当前宿主或显式选定的外部 provider 执行
when_not_to_use:
  - 契约尚未冻结（上游契约产物先行冻结，再进实现）
  - 纯规划/评审/调研类任务（无代码落地交付物）
verification: 执行内核=host-native；默认 HOST_NATIVE 消费有界执行包；真实非空产物和 hash 留痕。外部 provider 仅显式选用；无执行器为 BRIEF_ONLY、executed=false，不宣称执行或方法应用成功。
