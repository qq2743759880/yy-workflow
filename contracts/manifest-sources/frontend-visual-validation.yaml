id: frontend-visual-validation
when_to_use:
  - Web 前端页面/组件实现并应用样式后，需要真实浏览器视觉验收（截图→审查→修正→复测闭环）
  - 需要视觉回归（L0 像素 diff 全量）与语义抽样（L1 VLM 只审 diff 影响页+关键页）
when_not_to_use:
  - 非 Web 前端（vendor 原文：当前项目只覆盖 Web 前端）
  - 项目无前端工程（package.json+Vite dev script）或 Playwright 不可用、输入规格缺失时（前置不满足即阻塞上报）
verification: 产物为结构化视觉报告：L0 `toHaveScreenshot()` 像素基线比对（375/768/1024/1280/1440 视口），L1 只审 `visual-diff-pages.mjs` 清单+关键页；dev server 无法启动→输出明确阻塞报告不伪造截图；基线只在规格改变时更新（禁为通过盲目覆盖）
