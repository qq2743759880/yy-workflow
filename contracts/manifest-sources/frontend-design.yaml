id: frontend-design
when_to_use:
  - 有界面产物的前端任务按 L0-L3 分级加载：L1 既有样式微调只跑 frontend-quality-gate 机检门；L2 标准页面/组件走 Design Read+三拨盘+按主题引用 reference（≤3 篇）+相关域数据查询；L3 全设计任务进完整 taste 工作流与显式请求的 PICKER 原型
  - 需要真查设计数据再定风格/配色/字体/组件/动效（search.py 查 ux/style/color/typography/gsap/chart 目录）与组件选型
when_not_to_use:
  - L0 无界面产物任务（纯后端、脚本、文档）——不加载本资产
  - 纯数据表格/仪表盘类产品 UI（taste 上游明示不适用域）；分级未接入运行时前由派单方声明级别（缺省 L2，候选政策见契约 tier_policy_status）
verification: 分级语义下产物证据按级别适用：L1=仅机检门输出（frontend-quality-gate exit code+警告清单，主观项如实 N/A 不计 PASS）；L2+=Design Read 一行+三拨盘取值理由+search.py 真实查询行（python 缺失读 CSV 或显式声明跳过，禁伪造）+机检门；机检门只证代码静态项，不证审美/真实交互/可访问性全量/响应式实测；S3 marker（shadcn/bolt.new）+消费锚点机验
