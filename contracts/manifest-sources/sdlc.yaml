id: sdlc
when_to_use:
  - 任务需要 plan→develop→review→summarize 四阶段全流程编排（BMAD-METHOD 方法论层 + cline 执行层）
  - 需要六 agent（control/developer/peer/sprint/summary/supervisor）分角色的阶段文档产出
when_not_to_use:
  - 单步小任务，无需四阶段全流程编排与阶段文档
  - 只要直接执行、不要监督/对等/总结闭环的任务
verification: 产物为 phase-plan/develop/review/summarize.md 阶段文档；执行内核=cline（scripts/lib/adapters/bmad-cline.mjs）：probe `cline --version` 可用则 spawn 真执行，缺失诚实降级 planned-only（--backend cli 模式为 SDLC_NOT_AVAILABLE），timeout 返回 TIMEOUT，禁伪报成功；S3 保留 cline/BMAD marker
