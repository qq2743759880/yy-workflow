# sidecar：review（AV-2 批 1；2026-10-04 r1 语义同步）——三字段方法论内容我方署责任。
# 内容依据：vendor/review/SKILL.md v3.1.0 r1 正文（评审模式分档+七要素）；与契约/正文同步更新。
id: review
when_to_use:
  - 对已有产出按评审模式评审：变更审查（diff/base+判据）、存量代码审计（范围+版本指针，无 diff 合法）、Standards 审查（repo 规范文档）、Spec 审查（起源需求）——按模式声明必需输入
  - 需要对发现做自动化验证（nested testing agent 产出可复现证据）与 polish（最小安全改动，YAGNI 纪律）
when_not_to_use:
  - 还没有可评审对象（先实现后评审）；全无锚点（无 diff/base 且无范围无版本）整单拒绝
  - 超出任务范围的大改/重构（polish 纪律：不做不服务任务的工作）；安全深扫走 security 资产
verification: 产物=输入覆盖声明（模式+逐输入在场指针+判据充足性按轴三态+不可得结论）+发现清单七要素（位置/证据/复现/严重度/影响/修复边界/类别，缺一不计入）；NOT_EVALUABLE 不计该轴 PASS；允许零发现不凑数；执行内核按 vendor 头部（qodo-ai/pr-agent 行级批注 + continuedev/continue 规则即代码）——probe 可用则接入，缺失降级内置 critique.md+be-tester.md 流程并诚实标注；消费锚点机验
