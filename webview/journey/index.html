<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journey 现状导航</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<a class="skip-link" href="#main">跳到主内容</a>

<header class="page-header">
  <p class="eyebrow">YY · Journey Control Room</p>
  <h1>现状导航</h1>
  <p class="page-meta" id="page-meta"></p>
</header>

<!-- 顶部告警条：degraded / conflict 时显示，健康时隐藏 -->
<div id="alert-banner" class="alert-banner" role="alert" hidden>
  <p class="alert-title" id="alert-title"></p>
  <p class="alert-reason" id="alert-reason"></p>
  <ul class="alert-conflicts" id="alert-conflicts"></ul>
</div>

<main id="main" class="main">
  <p id="loading" class="muted-note">正在读取 journey 投影...</p>

  <!-- 九节点 journey 网格（0-8，含回跳层），节点名 + 状态徽章 + gate 卡 -->
  <section aria-labelledby="journey-heading">
    <h2 id="journey-heading" class="section-title">九节点进度</h2>
    <div class="journey-grid" id="journey-grid"></div>
  </section>

  <section aria-labelledby="delegation-heading">
    <h2 id="delegation-heading" class="section-title">人工交接</h2>
    <div id="delegation-list"><p class="muted-note">正在读取人工交接状态...</p></div>
  </section>

  <!-- 证据列表 -->
  <section aria-labelledby="evidence-heading" id="evidence-section" hidden>
    <h2 id="evidence-heading" class="section-title">证据</h2>
    <ul class="evidence-list" id="evidence-list"></ul>
  </section>

  <!-- 下一步提示区（nextPromptView + 复制按钮占位，FE-2 完善） -->
  <section aria-labelledby="next-heading" id="next-section" hidden>
    <h2 id="next-heading" class="section-title">下一步提示</h2>
    <div class="next-prompt">
      <p class="next-hint" id="next-hint"></p>
      <p class="next-meta" id="next-meta"></p>
      <button type="button" class="copy-button" id="copy-next-prompt" data-copy-label="复制提示" aria-label="复制下一步提示文本">复制提示</button>
      <p class="copy-feedback" id="copy-feedback" role="status" aria-live="polite"></p>
    </div>
  </section>

  <!-- B 阶段手册：数据源 content.js.phases（构建期静态产物），7 command 入口含研究门 -->
  <section aria-labelledby="phases-heading" id="phases-section">
    <h2 id="phases-heading" class="section-title">阶段手册</h2>
    <p class="muted-note">7 个入口逐段：目标、注入内容摘要、配套资产、催办话术与重走等效 Prompt。</p>
    <div class="phase-list" id="phases-list"></div>
  </section>

  <!-- C 资产手册：数据源 content.js.assets，9 资产卡片 -->
  <section aria-labelledby="assets-heading" id="assets-section">
    <h2 id="assets-heading" class="section-title">资产手册</h2>
    <p class="muted-note">9 个资产逐卡片：功能一句话、所属域簇、强制点名话术。</p>
    <div class="asset-grid" id="asset-grid"></div>
  </section>

  <!-- 全局复制反馈（aria-live polite）：每按钮自身也有可见状态文案 -->
  <p class="copy-feedback" id="copy-status" role="status" aria-live="polite"></p>
</main>

<script>
// 页面入口：消费 window.__YY_JOURNEY__（host-bridge 注入）+ render-core 纯视图模型。
// 零运行时依赖；本页不写任何状态（冻结 §3.2），复制仅走 clipboard API（FE-2 完善，此处占位）。
(function () {
  'use strict';

  var NODE_META = [
    { step: 0, name: '资产整合', gate: null },
    { step: 1, name: '文档化', gate: 'concept-signed' },
    { step: 2, name: '重执行1', gate: null },
    { step: 3, name: '拆任务', gate: 'premise-signed' },
    { step: 4, name: '重执行1,2', gate: null },
    { step: 5, name: '规划+契约', gate: 'contract-frozen' },
    { step: 6, name: '重执行1,2,3', gate: null },
    { step: 7, name: '并行派单', gate: 'gate-a-approved' },
    { step: 8, name: '批判反哺', gate: null }
  ];

  // 状态徽章文案（语义色之外还有文字，不靠颜色单独传义）
  var STATE_LABEL = {
    AUTHORIZED: '已确认', OBSERVED: '已观察', INFERRED: '已推断',
    STALE: '已过期', PARTIAL: '不完整', ERROR: '错误',
    FAILED: '失败', SKIPPED: '已跳过', UNRESOLVED: '未解决'
  };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function stepFor(n) { return NODE_META[n] || { step: n, name: '节点 ' + n, gate: null }; }

  function renderDelegation(core,payload) {
    var list=document.getElementById('delegation-list'),view=core.delegationView(payload);list.textContent='';
    if(view.reason)list.appendChild(el('p','muted-note',view.reason));
    view.tasks.forEach(function(task) {
      var card=el('article','next-prompt delegation-card');card.setAttribute('data-delegation-task',task.task_id);
      card.appendChild(el('h3','node-name',task.task_id));
      card.appendChild(el('p','badge state-'+(task.stale?'STALE':'OBSERVED'),task.handoff_status+(task.stale?' · 数据已过期':'')));
      card.appendChild(el('p','muted-note','revision '+task.revision+' · state version '+task.state_version));
      card.appendChild(el('p','',task.owner_summary));
      card.appendChild(el('p','muted-note','委派：'+task.delegation_mode+' · 本地执行：'+(task.executed?'已观察':'未执行')+' · 验收：'+task.validation_status+' · 独立性：'+task.independence_status));
      card.appendChild(el('p','muted-note','输入 '+task.input_bytes+' bytes · token '+(task.token_count===null?'未知':task.token_count)+' · 用量 '+task.usage_status+' · 下一步 '+task.next_action));
      card.appendChild(el('p','muted-note',task.registered?'已登记，成果返回后须本地验收。':'预览未登记，须先在本地准备交接。'));
      if(task.preview_text!==null) {
        var text=el('textarea','delegation-preview');text.value=task.preview_text;text.readOnly=true;text.rows=6;text.setAttribute('data-delegation-preview','');text.setAttribute('aria-label','可选择的交接预览文本');card.appendChild(text);
        var button=el('button','copy-button','复制交接预览');button.type='button';button.setAttribute('data-copy-delegation','');button.setAttribute('data-copy-label','复制交接预览');
        var feedback=el('p','copy-feedback');feedback.setAttribute('role','status');feedback.setAttribute('aria-live','polite');feedback.setAttribute('data-delegation-feedback','');
        button.onclick=function(){copyText(task.preview_text,button,feedback);};card.appendChild(button);card.appendChild(feedback);
      }
      list.appendChild(card);
    });
  }

  function renderStepNodes(view, core) {
    var grid = document.getElementById('journey-grid');
    grid.textContent = '';
    NODE_META.forEach(function (meta) {
      var node = el('article', 'journey-node');
      var m = meta.step;
      var raw = null;
      if (Array.isArray(view.steps)) {
        for (var i = 0; i < view.steps.length; i++) {
          if (view.steps[i].step === m) { raw = view.steps[i]; break; }
        }
      }
      var s = raw || core.mapStep(null); // 缺失行也走 mapStep，display=ERROR，不伪造成功
      node.appendChild(el('p', 'node-step', '节点 ' + m));
      node.appendChild(el('h3', 'node-name', stepFor(m).name));
      var badge = el('p', 'badge state-' + s.display, (STATE_LABEL[s.display] || s.display) + ' · ' + s.display);
      badge.setAttribute('data-state', s.display);
      node.appendChild(badge);

      // gate 卡合并进节点：卡在哪个 gate / 看什么 / 说什么通过
      var gateCard = el('div', 'gate-card');
      var gateName = stepFor(m).gate;
      gateCard.appendChild(el('p', 'gate-line', gateName ? ('gate: ' + gateName) : 'gate: 无（回跳层）'));
      var status = s.status || 'pending';
      var look, say;
      if (s.done) {
        look = '看：该节点交付物已确认';
        say = '通过：节点 ' + m + ' 已完成';
      } else if (s.negative) {
        look = '看：' + (s.blockerReason || '节点处于负态，先修复再前进');
        say = '说：修复后重执行本节点';
      } else {
        look = gateName ? ('看：' + gateName + ' 是否已签署（gates_passed）') : '看：本节点是否已到 done';
        say = gateName ? ('说：请通过 gate ' + gateName) : '说：请完成节点 ' + m;
      }
      gateCard.appendChild(el('p', 'gate-look', look));
      gateCard.appendChild(el('p', 'gate-say', say));
      node.appendChild(gateCard);
      grid.appendChild(node);
    });
  }

  function renderAlert(view, core) {
    var banner = document.getElementById('alert-banner');
    var title = document.getElementById('alert-title');
    var reason = document.getElementById('alert-reason');
    var conflicts = document.getElementById('alert-conflicts');
    conflicts.textContent = '';

    if (view.degraded) {
      banner.hidden = false;
      title.textContent = '降级：数据源不可用';
      reason.textContent = view.bridgeReason || '注入载荷缺失或非法';
      return;
    }
    if (view.conflict) {
      banner.hidden = false;
      title.textContent = '冲突：投影数据源矛盾（' + view.conflict.code + '）';
      reason.textContent = view.conflict.displayReason || '两侧证据均列出，不自动取舍';
      (view.conflict.conflicts || []).forEach(function (c) {
        conflicts.appendChild(el('li', 'alert-conflict-item',
          typeof c === 'string' ? c : JSON.stringify(c)));
      });
      return;
    }
    banner.hidden = true; // 健康时隐藏
  }

  // 接收归一化后的 np 对象（nextPromptView 输出），直接使用；null 时隐藏区块
  function renderNextPrompt(np) {
    var section = document.getElementById('next-section');
    if (!np) { section.hidden = true; return; }
    section.hidden = false;
    document.getElementById('next-hint').textContent = np.actionHint || '（无 actionHint）';
    var meta = [];
    if (np.targetNode != null) meta.push('目标节点: ' + np.targetNode);
    if (np.requiredInputs.length) meta.push('必需输入: ' + np.requiredInputs.join(', '));
    if (np.snapshotHash) meta.push('snapshot: ' + np.snapshotHash);
    document.getElementById('next-meta').textContent = meta.join(' | ') || ' ';
    var btn = document.getElementById('copy-next-prompt');
    var feedback = document.getElementById('copy-feedback');
    btn.onclick = function () {
      copyText(np.actionHint || '', btn, feedback);
    };
  }

  // 统一复制通道：唯一"写"操作是剪贴板；成功/失败反馈态（按钮文案 + aria-live polite）
  function copyText(text, btn, feedback) {
    var status = document.getElementById('copy-status');
    function report(msg, label) {
      if (feedback) feedback.textContent = msg;
      if (status) status.textContent = (btn ? btn.getAttribute('data-copy-label') + ': ' : '') + msg;
      if (btn) { btn.textContent = label; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      btn.textContent = '复制中...';       // loading 态（写剪贴板为同步微任务，仍给即时反馈）
      navigator.clipboard.writeText(text).then(function () {
        report('已复制到剪贴板', '已复制');
        if (btn) {
          setTimeout(function () { btn.textContent = btn.getAttribute('data-copy-label') || btn.textContent; }, 2000); // success 态回落：按钮自身标签
        }
      }, function () {
        report('复制失败（环境拒绝剪贴板访问）', '复制失败');
      });
    } else {
      report('复制失败（环境不支持 clipboard API）', '复制失败');
    }
  }

  // B 阶段手册：消费 GUIDE_CONTENT.phases（构建产物），7 command 入口含研究门；
  // GUIDE_CONTENT 缺失时不静默：由 loadGuideContent 走告警条，此处只守卫 DOM
  function renderPhases() {
    var list = document.getElementById('phases-list');
    if (!list || typeof GUIDE_CONTENT === 'undefined' || !Array.isArray(GUIDE_CONTENT.phases)) return false;
    list.textContent = '';
    GUIDE_CONTENT.phases.forEach(function (p) {
      var item = el('article', 'phase-item');
      item.appendChild(el('p', 'phase-step', '阶段 ' + (p.step != null ? p.step : '?')));
      item.appendChild(el('h3', 'phase-name', p.name || ''));
      item.appendChild(el('p', 'phase-goal', p.goal || ''));
      item.appendChild(el('p', 'phase-summary', p.summary || ''));

      // 配套资产名（如有）
      if (Array.isArray(p.assets) && p.assets.length) {
        var names = [];
        p.assets.forEach(function (a) { names.push(a.name || ''); });
        item.appendChild(el('p', 'phase-assets', '配套资产: ' + names.filter(Boolean).join(', ')));
      }

      // 纪律要点（如 content.js 携带）
      if (Array.isArray(p.discipline) && p.discipline.length) {
        item.appendChild(el('p', 'phase-discipline', '纪律: ' + p.discipline.join(' / ')));
      }

      // 催办话术（复制按钮）
      var kick = el('div', 'phase-prompt');
      kick.appendChild(el('p', 'prompt-label', '催办话术'));
      var kickBtn = el('button', 'copy-button phase-copy', '复制文本');
      kickBtn.type = 'button';
      kickBtn.setAttribute('data-copy-label', '催办话术');
      kick.appendChild(kickBtn);
      item.appendChild(kick);

      // 重走等效 Prompt（复制按钮）
      var redo = el('div', 'phase-prompt');
      redo.appendChild(el('p', 'prompt-label', '重走等效 Prompt'));
      var redoBtn = el('button', 'copy-button phase-copy', '复制文本');
      redoBtn.type = 'button';
      redoBtn.setAttribute('data-copy-label', '重走等效 Prompt');
      redo.appendChild(redoBtn);
      item.appendChild(redo);

      kickBtn.onclick = function () { copyText(p.kickPrompt || '', kickBtn, null); };
      redoBtn.onclick = function () { copyText(p.redoPrompt || '', redoBtn, null); };
      list.appendChild(item);
    });
    return true;
  }

  // C 资产手册：消费 GUIDE_CONTENT.assets，9 资产卡片（守卫语义同 renderPhases）
  function renderAssets() {
    var grid = document.getElementById('asset-grid');
    if (!grid || typeof GUIDE_CONTENT === 'undefined' || !Array.isArray(GUIDE_CONTENT.assets)) return false;
    grid.textContent = '';
    GUIDE_CONTENT.assets.forEach(function (a) {
      var card = el('article', 'asset-card');
      card.appendChild(el('h3', 'asset-name', a.name || ''));
      if (a.cluster) {
        card.appendChild(el('p', 'cluster-badge', '域簇 ' + a.cluster)); // 徽章：文字+色，不靠颜色单独传义
      }
      card.appendChild(el('p', 'asset-desc', a.description || ''));
      if (Array.isArray(a.stages) && a.stages.length) {
        card.appendChild(el('p', 'asset-stages', '可能用到的阶段: ' + a.stages.join(', ')));
      }
      // 强制点名话术（复制按钮）
      var forced = el('div', 'phase-prompt');
      forced.appendChild(el('p', 'prompt-label', '强制点名话术'));
      var forcedBtn = el('button', 'copy-button asset-copy', '复制文本');
      forcedBtn.type = 'button';
      forcedBtn.setAttribute('data-copy-label', '强制点名话术');
      forced.appendChild(forcedBtn);
      card.appendChild(forced);
      forcedBtn.onclick = function () {
        var text = '请你现在读取并应用 ' + (a.name || '') + ' 的方法论';
        copyText(text, forcedBtn, null);
      };
      grid.appendChild(card);
    });
    return true;
  }

  function renderEvidence(view) {
    var section = document.getElementById('evidence-section');
    var list = document.getElementById('evidence-list');
    list.textContent = '';
    if (!view.evidence || !view.evidence.length) { section.hidden = true; return; }
    section.hidden = false;
    view.evidence.forEach(function (e) {
      list.appendChild(el('li', 'evidence-item',
        typeof e === 'string' ? e : JSON.stringify(e)));
    });
  }

  function renderMeta(view) {
    var meta = document.getElementById('page-meta');
    var parts = [];
    if (view.sessionId != null) parts.push('session: ' + view.sessionId);
    if (view.displayStatus) parts.push('投影状态: ' + view.displayStatus);
    if (view.phase) parts.push('阶段: ' + view.phase);
    if (view.updatedAt) parts.push('更新于: ' + view.updatedAt);
    meta.textContent = parts.join(' | ');
  }

  function renderNotFound(view) {
    var grid = document.getElementById('journey-grid');
    grid.textContent = '';
    var card = el('article', 'journey-node');
    card.appendChild(el('h3', 'node-name', '未找到 journey'));
    card.appendChild(el('p', 'gate-look', (view.notFoundDiag && view.notFoundDiag.reason) || '无 journey 文件且无可推断源'));
    card.appendChild(el('p', 'gate-say', (view.notFoundDiag && view.notFoundDiag.initGuidance) || ''));
    grid.appendChild(card);
  }

  // B/C 手册内容装载：动态 import('./content.js')（与 render-core 同型），
  // 失败走告警条显式报错（不静默）；成功后渲染 B/C 区块
  function loadGuideContent() {
    return import('./content.js').then(function (mod) {
      window.GUIDE_CONTENT = (mod && mod.GUIDE_CONTENT) || null;
      var okPhases = renderPhases();
      var okAssets = renderAssets();
      if (!okPhases || !okAssets) {
        var banner = document.getElementById('alert-banner');
        banner.hidden = false;
        document.getElementById('alert-title').textContent = '错误：手册内容装载不完整';
        document.getElementById('alert-reason').textContent = 'content.js 已加载但 phases/assets 数据缺失（phases=' +
          (window.GUIDE_CONTENT && Array.isArray(window.GUIDE_CONTENT.phases) ? window.GUIDE_CONTENT.phases.length : 0) +
          ', assets=' + (window.GUIDE_CONTENT && Array.isArray(window.GUIDE_CONTENT.assets) ? window.GUIDE_CONTENT.assets.length : 0) + '）';
        return false;
      }
      return true;
    }, function (e) {
      var banner = document.getElementById('alert-banner');
      banner.hidden = false;
      document.getElementById('alert-title').textContent = '错误：手册内容加载失败';
      document.getElementById('alert-reason').textContent = 'content.js 加载失败: ' + e.message;
      return false;
    });
  }

  function main(core) {
    var payload = window.__YY_JOURNEY__;
    var view = core.deriveJourneyView(payload);
    document.getElementById('loading').hidden = true;
    renderAlert(view, core);
    renderDelegation(core,payload);
    loadGuideContent();
    if (view.degraded) {
      document.getElementById('journey-grid').textContent = '';
      return; // 降级：只有告警条，不伪造数据
    }
    if (view.notFound) { renderNotFound(view); document.getElementById('next-section').hidden = true; return; }
    renderMeta(view);
    renderStepNodes(view, core);
    renderEvidence(view);
    // B/C 手册区块：content.js 构建产物，独立装载渲染（失败走告警条，不静默）；
    // 投影降级/notFound 时也照常装载（手册不依赖注入数据）
    // 下一步提示区：deriveJourneyView 内部已走 nextPromptView 归一化（deriveJourneyView 内部调用
    // nextPromptView/conflictView 归一化 nextPrompt 与 conflict，页面消费其组合产物）；此处再过一遍幂等，
    // 归一化对象直接传 renderNextPrompt（np=null 时显式隐藏）
    renderNextPrompt(core.nextPromptView(view.nextPrompt));
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      import('./render-core.mjs').then(main, function (e) {
        document.getElementById('loading').textContent = 'render-core 加载失败: ' + e.message;
      });
    });
  } else {
    import('./render-core.mjs').then(main, function (e) {
      document.getElementById('loading').textContent = 'render-core 加载失败: ' + e.message;
    });
  }
})();
</script>
</body>
</html>
