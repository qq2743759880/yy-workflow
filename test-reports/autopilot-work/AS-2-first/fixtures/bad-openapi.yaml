# AS-2-first 影子跑夹具（Step 2a）——确定性违规集，Spectral 默认 oas 规则集必抓。
# 违规清单（逐条与规则 id 对应）：
#   1. 无 servers                       → oas3-api-servers
#   2. info 无 description              → info-description
#   3. info 无 contact                  → info-contact
#   4. GET /pets 无 operationId         → operation-operationId
#   5. GET /pets 无 2xx 响应（仅 404）   → operation-success-response
#   6. tag "pets" 未在顶层 openapi.tags 声明 → operation-tag-defined
#   7. 顶层无 openapi.tags              → openapi-tags
#   8. /pets/{petId} 路径参数未声明      → path-params
# 旧引擎注意：现 portman adapter 的文件型契约门只认 .json 后缀（subtask.contract.endsWith('.json')），
# 故旧路径实测用同文档的 .json 孪生（bad-openapi.json），YAML 版为新引擎 canonical 输入。
openapi: 3.0.0
info:
  title: Pets API (AS-2-first shadow fixture)
  version: 1.0.0
paths:
  /pets:
    get:
      description: List pets. Missing operationId and no 2xx response (deterministic violations).
      tags:
        - pets
      responses:
        '404':
          description: Not found
  /pets/{petId}:
    get:
      description: Get one pet. Path parameter petId is not declared (deterministic violation).
      responses:
        '200':
          description: OK
