# orchestrator.config.yaml — 六字段编排配置
# 来源：scripts/executor-setup.mjs 向导（--configure）；可后改。

#orchestrator
orchestrator.subagentSource: "session"  # 默认 "session" · 子 agent 由本编排会话内建调度，无需额外 CLI（零依赖、最低门槛）。
orchestrator.delegationMode: "self-dispatch"  # 默认 "self-dispatch" · 编排者自己派单给子 agent，简单场景不经过用户交接；复杂决策再切 handoff-prompt。

#critique
critique.sources: "none"  # 默认 "none" · 批判源清单尚无既有清单（CR-1 未落），先空（none）；确认后再逐项填知识库/搜索/标准文档路径。

#report
report.style: "plain"  # 默认 "plain" · 验收报告先按大白话（plain）交付，后续按需切 technical 或两者并存。

#blindwalk
blindwalk.enabled: true  # 默认 "true" · 阶段盲测是终验纪律（SB-1），默认开启防学习效应；验收通过可关。

#mcp
mcp.tools: []  # 默认 [] · MCP server（chrome-devtools-mcp 等）按需接入，默认不接（零依赖）。
