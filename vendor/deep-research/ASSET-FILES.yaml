schema: yy/asset-files@1
asset: deep-research
iteration_protocol: reference/asset-iteration.md
files:
  - match: ".env.example"
    state: "PROVENANCE"
    consumer: "distribution"
  - match: "ASSET-FILES.yaml"
    state: "PROVENANCE"
    consumer: "distribution"
  - match: "LICENSE"
    state: "PROVENANCE"
    consumer: "distribution"
  - match: "README.md"
    state: "PROVENANCE"
    consumer: "distribution"
  - match: "VENDORED.md"
    state: "PROVENANCE"
    consumer: "distribution"
  - match: "package-lock.json"
    state: "PROVENANCE"
    consumer: "distribution"
  - match: "package.json"
    state: "PROVENANCE"
    consumer: "distribution"
  - match: "src/ai/providers.ts"
    state: "EXECUTABLE"
    consumer: "scripts/research-gate.mjs"
    load: "research kernel source package; entry src/deep-research.ts"
  - match: "src/ai/text-splitter.ts"
    state: "EXECUTABLE"
    consumer: "scripts/research-gate.mjs"
    load: "research kernel source package; entry src/deep-research.ts"
