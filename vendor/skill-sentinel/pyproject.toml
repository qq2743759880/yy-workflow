[project]
name = "skill-sentinel"
version = "0.3.0"
description = "Scan Agent Skill packages for security threats using multi-agent AI analysis"
authors = [{ name = "Enkrypt AI" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10,<3.14"
keywords = ["security", "agent", "skill", "scanner", "crewai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "crewai[tools]>=1.9,<2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/enkryptai/skill-sentinel"
Repository = "https://github.com/enkryptai/skill-sentinel"
Documentation = "https://github.com/enkryptai/skill-sentinel#readme"
Issues = "https://github.com/enkryptai/skill-sentinel/issues"

[project.scripts]
skill-sentinel = "skill_sentinel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_sentinel"]

[tool.hatch.build]
# Include non-Python data files (yaml, json, md) in the wheel
include = [
    "src/skill_sentinel/**/*.py",
    "src/skill_sentinel/**/*.yaml",
    "src/skill_sentinel/**/*.yml",
    "src/skill_sentinel/**/*.json",
    "src/skill_sentinel/**/*.md",
]
