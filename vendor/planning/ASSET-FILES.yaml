schema: yy/asset-files@1
asset: planning
iteration_protocol: reference/asset-iteration.md
files:
- match: ASSET-FILES.yaml
  state: PROVENANCE
  consumer: distribution
- match: LICENSES.md
  state: PROVENANCE
  consumer: distribution
- match: SKILL.md
  state: ACTIVE_ENTRY
  consumer: activation
  load: entry
- match: reference/LICENSE
  state: PROVENANCE
  consumer: distribution
- match: reference/formal-prd.md
  state: ACTIVE_RESOURCE
  consumer: vendor/planning/METHODOLOGY.json
  load: declared mode/phase/resource condition only
- match: METHODOLOGY.json
  state: ACTIVE_RESOURCE
  consumer: scripts/lib/methodology.mjs
  load: selected asset declaration
- match: UPSTREAM-REUSE.yaml
  state: PROVENANCE
  consumer: distribution
