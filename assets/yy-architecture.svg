<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1070" viewBox="0 0 960 1070" role="img" aria-labelledby="title desc"><title id="title">YY 如何把任务接到真实交付</title><desc id="desc">准入、装配、执行、证据与验收各有明确责任</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="#65dfe8"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#f4f7fb}.title{font-size:35px;font-weight:700}.sub{font-size:19px;fill:#aab8cc}.label{font-size:22px;font-weight:700}.body{font-size:19px;fill:#c1d0df}.command{font-size:19px;fill:#65dfe8;font-weight:600}.small{font-size:18px;fill:#a8bccd}.edge{font-size:18px;fill:#4ddaff}.num{font-size:18px;fill:#65dfe8;font-weight:700}.box{fill:#172233;stroke:#35546b;stroke-width:1.4}.flow{fill:none;stroke:#65dfe8;stroke-width:2.4}.return{fill:none;stroke:#65dfe8;stroke-width:2;stroke-dasharray:7 6}.rule{stroke:#294154;stroke-width:1}</style><rect width="960" height="1070" fill="#0d1420"/><rect x="36" y="37" width="5" height="36" fill="#5887ff"/><text x="55" y="68" class="title">YY 如何把任务接到真实交付</text><text x="40" y="107" class="sub">准入、装配、执行、证据与验收各有明确责任</text><g transform="translate(0,-80)"><rect x="40" y="240" width="320" height="123" rx="16" class="box"/><text x="60" y="274" class="label">七个用户入口</text><text x="60" y="307" class="body">立项 → 需求 → 研究 → 拆任务</text><text x="60" y="337" class="body">冻结契约 → 执行 → 验收</text><rect x="465" y="240" width="455" height="123" rx="16" class="box"/><text x="485" y="274" class="label">C4 宿主入口 + Decision Core</text><text x="485" y="307" class="body">核准阶段、路由与资产资格</text><text x="485" y="337" class="command">先展示原包，再复核；允许后才能执行</text><path d="M360 301 H457" class="flow" marker-end="url(#arrow)"/><text x="384" y="290" class="edge">请求</text><rect x="40" y="447" width="425" height="205" rx="16" class="box"/><text x="60" y="482" class="label">九项方法资产，按需装配</text><text x="60" y="515" class="body">规划：dev-planner · planning</text><text x="60" y="544" class="body">可选治理：sdlc（显式授权）</text><text x="60" y="575" class="small">实现：implementation · frontend-design</text><text x="60" y="606" class="small">审查：review · be-validator · security</text><text x="60" y="636" class="small">skill-sentinel；不是九个并行 Agent</text><rect x="560" y="447" width="360" height="205" rx="16" class="box"/><text x="580" y="482" class="label">当前宿主执行</text><text x="580" y="516" class="body">默认：宿主原生执行</text><text x="580" y="546" class="body">可选：显式 Provider</text><text x="580" y="576" class="body">人工交接：受控任务包</text><text x="580" y="616" class="small">缺真实绑定时，不冒充已执行</text><path d="M550 363 V408 H252 V439" class="flow" marker-end="url(#arrow)"/><text x="281" y="402" class="edge">按资格选择</text><path d="M745 363 V439" class="flow" marker-end="url(#arrow)"/><text x="762" y="406" class="edge">允许后执行</text><path d="M465 550 H552" class="flow" marker-end="url(#arrow)"/><text x="480" y="536" class="edge">方法包</text><rect x="560" y="732" width="360" height="119" rx="16" class="box"/><text x="580" y="768" class="label">结果与证据</text><text x="580" y="801" class="body">真实产物 · 退出码 · 哈希</text><text x="580" y="832" class="small">方法包已送达 ≠ 方法论已应用</text><rect x="40" y="732" width="425" height="119" rx="16" class="box"/><text x="60" y="768" class="label">独立复验 + 确定性 checker</text><text x="60" y="801" class="body">需要独立验收时，真实复现行为</text><text x="60" y="832" class="small">验收证据绑定本次产物与哈希</text><path d="M740 652 V724" class="flow" marker-end="url(#arrow)"/><text x="758" y="691" class="edge">留下实证</text><path d="M560 791 H473" class="flow" marker-end="url(#arrow)"/><text x="494" y="778" class="edge">复验</text><rect x="40" y="938" width="425" height="118" rx="16" class="box"/><text x="60" y="974" class="label">接受 · 返工 · 恢复</text><text x="60" y="1007" class="body">通过后接受；失败则返工再验</text><text x="60" y="1038" class="small">恢复前重核已接受产物与证据</text><path d="M252 851 V930" class="flow" marker-end="url(#arrow)"/><text x="267" y="895" class="edge">证据通过</text><path d="M465 997 H939 V301 H928" class="return" marker-end="url(#arrow)"/><text x="572" y="988" class="edge">返工 / 恢复时重新准入</text><path d="M425 851 V895 H939" class="return" marker-end="url(#arrow)"/><text x="568" y="886" class="edge">未通过：返工并重新准入</text><text x="560" y="1040" class="small">外围接法：V2 共用 Decision</text><text x="560" y="1070" class="small">M1 只兼容旧读取，不决定准入。</text><path d="M907 1035 H951 V272 H928" class="return" marker-end="url(#arrow)"/><text x="40" y="1123" class="small">后续门槛：C5 方法论写入尚未交付。无 brief 的原生工作也须重新复核。</text></g></svg>