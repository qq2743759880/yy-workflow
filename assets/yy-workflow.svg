<svg xmlns="http://www.w3.org/2000/svg" width="960" height="882" viewBox="0 0 960 882" role="img" aria-labelledby="title desc"><title id="title">从想法走到可复验的交付</title><desc id="desc">七个用户入口 · 先把方向说清，再把任务做成</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="#65dfe8"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#f4f7fb}.title{font-size:35px;font-weight:700}.sub{font-size:19px;fill:#aab8cc}.label{font-size:22px;font-weight:700}.body{font-size:19px;fill:#c1d0df}.command{font-size:19px;fill:#65dfe8;font-weight:600}.small{font-size:18px;fill:#a8bccd}.edge{font-size:18px;fill:#4ddaff}.num{font-size:18px;fill:#65dfe8;font-weight:700}.box{fill:#172233;stroke:#35546b;stroke-width:1.4}.flow{fill:none;stroke:#65dfe8;stroke-width:2.4}.return{fill:none;stroke:#65dfe8;stroke-width:2;stroke-dasharray:7 6}.rule{stroke:#294154;stroke-width:1}</style><rect width="960" height="882" fill="#0d1420"/><rect x="36" y="37" width="5" height="36" fill="#5887ff"/><text x="55" y="68" class="title">从想法走到可复验的交付</text><text x="40" y="107" class="sub">七个用户入口 · 先把方向说清，再把任务做成</text><rect x="40" y="157" width="202" height="157" rx="16" class="box"/><text x="56" y="185" class="num">01</text><text x="56" y="215" class="label">立项</text><text x="56" y="245" class="command">/yy 0</text><text x="56" y="275" class="body">定边界，盘点资产</text><text x="56" y="299" class="small">项目资料</text><rect x="266" y="157" width="202" height="157" rx="16" class="box"/><text x="282" y="185" class="num">02</text><text x="282" y="215" class="label">需求</text><text x="282" y="245" class="command">/yy 1</text><text x="282" y="275" class="body">澄清目标与概念</text><text x="282" y="299" class="small">PRD 草案</text><rect x="492" y="157" width="202" height="157" rx="16" class="box"/><text x="508" y="185" class="num">03</text><text x="508" y="215" class="label">研究</text><text x="508" y="245" class="command">/yy research</text><text x="508" y="275" class="body">查方案与竞品</text><text x="508" y="299" class="small">真实来源与差距</text><rect x="718" y="157" width="202" height="157" rx="16" class="box"/><text x="734" y="185" class="num">04</text><text x="734" y="215" class="label">拆任务</text><text x="734" y="245" class="command">/yy 2</text><text x="734" y="275" class="body">挑战前提与验收</text><text x="734" y="299" class="small">任务总纲</text><path d="M242 230 H260" class="flow" marker-end="url(#arrow)"/><path d="M468 230 H486" class="flow" marker-end="url(#arrow)"/><path d="M694 230 H712" class="flow" marker-end="url(#arrow)"/><text x="261" y="338" class="small">概念签收后研究 · 研究有真实证据再拆任务</text><path d="M819 314 V360 H24 V415 H141 V441" class="flow" marker-end="url(#arrow)"/><g transform="translate(0,-70)"><rect x="40" y="523" width="202" height="157" rx="16" class="box"/><text x="56" y="551" class="num">05</text><text x="56" y="581" class="label">冻结契约</text><text x="56" y="611" class="command">/yy 3</text><text x="56" y="641" class="body">审接口与错误码</text><text x="56" y="665" class="small">冻结契约</text><rect x="266" y="523" width="202" height="157" rx="16" class="box"/><text x="282" y="551" class="num">每次入口均须</text><text x="282" y="582" class="label">Decision 准入</text><text x="282" y="613" class="body">展示原始包</text><text x="282" y="639" class="body">执行前再次复核</text><text x="282" y="663" class="command">契约通过才开工</text><rect x="492" y="523" width="202" height="157" rx="16" class="box"/><text x="508" y="551" class="num">06</text><text x="508" y="581" class="label">派单执行</text><text x="508" y="611" class="command">/yy 4</text><text x="508" y="641" class="body">宿主执行有界任务</text><text x="508" y="665" class="small">代码与实跑证据</text><rect x="718" y="523" width="202" height="157" rx="16" class="box"/><text x="734" y="551" class="num">07</text><text x="734" y="581" class="label">验收反哺</text><text x="734" y="611" class="command">/yy 5</text><text x="734" y="641" class="body">独立复验，登记改进</text><text x="734" y="665" class="small">验收与改进清单</text><path d="M242 596 H260" class="flow" marker-end="url(#arrow)"/><path d="M468 596 H486" class="flow" marker-end="url(#arrow)"/><text x="469" y="572" class="edge">允许</text><path d="M694 596 H712" class="flow" marker-end="url(#arrow)"/><path d="M367 680 V719 H141 V688" class="return" marker-end="url(#arrow)"/><text x="164" y="714" class="edge">拒绝：补齐前置</text><path d="M819 680 V762 H593 V688" class="return" marker-end="url(#arrow)"/><text x="600" y="755" class="edge">未通过：返工后重验</text><rect x="40" y="803" width="880" height="118" rx="16" class="box"/><text x="60" y="837" class="label">需要修正时，可以回跳</text><text x="60" y="868" class="body">内部 2 / 4 / 6 承接需求、拆分与契约修正；它们不是 /yy 命令编号。</text><text x="60" y="897" class="small">入口对应内部步骤：0 → 1 → 1.5 → 3 → 5 → 7 → 8；每次重新核对准入与证据。</text></g></svg>