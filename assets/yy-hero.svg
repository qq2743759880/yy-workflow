<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}</style><rect width="100%" height="100%" fill="#0d1420"/><text x="64" y="116" font-size="64" font-weight="700" fill="#65dfe8">YY</text><text x="64" y="272" font-size="72" font-weight="700" fill="#f4f7fb">让 AI 开发从想法</text><text x="64" y="366" font-size="72" font-weight="700" fill="#f4f7fb">走向可验收的交付</text><text x="66" y="460" font-size="28" font-weight="400" fill="#aab8cc">七个流程入口 · 九项按需能力</text><text x="66" y="509" font-size="26" font-weight="400" fill="#aab8cc">连接任务规划、执行交接与独立验收</text><text x="66" y="650" font-size="22" font-weight="400" fill="#65dfe8">Owner 驾驶</text><text x="254" y="650" font-size="22" font-weight="400" fill="#65dfe8">Decision Core 准入</text><text x="550" y="650" font-size="22" font-weight="400" fill="#65dfe8">验收后再接受</text><rect x="965" y="180" width="235" height="64" rx="16" fill="#172233" stroke="#2b3d54"/><text x="996" y="221" font-size="26" font-weight="700" fill="#f4f7fb">想法</text><path d="M1082 246v22" stroke="#65dfe8" stroke-width="2"/><rect x="965" y="270" width="235" height="64" rx="16" fill="#172233" stroke="#2b3d54"/><text x="996" y="311" font-size="26" font-weight="700" fill="#f4f7fb">规划</text><path d="M1082 336v22" stroke="#65dfe8" stroke-width="2"/><rect x="965" y="360" width="235" height="64" rx="16" fill="#172233" stroke="#2b3d54"/><text x="996" y="401" font-size="26" font-weight="700" fill="#f4f7fb">执行</text><path d="M1082 426v22" stroke="#65dfe8" stroke-width="2"/><rect x="965" y="450" width="235" height="64" rx="16" fill="#172233" stroke="#2b3d54"/><text x="996" y="491" font-size="26" font-weight="700" fill="#f4f7fb">验收</text></svg>