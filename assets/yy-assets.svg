<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1472" viewBox="0 0 1200 1472"><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}</style><rect width="100%" height="100%" fill="#0d1420"/><text x="64" y="82" font-size="40" font-weight="700" fill="#f4f7fb">九项能力，按任务选用</text><text x="64" y="130" font-size="24" font-weight="400" fill="#aab8cc">需要什么，就装配什么；不是九个同时运行的 Agent。</text><text x="64" y="196" font-size="27" font-weight="700" fill="#65dfe8">规划</text><rect x="64" y="224" width="524" height="178" rx="16" fill="#172233" stroke="#2b3d54"/><text x="88" y="264" font-size="28" font-weight="700" fill="#f4f7fb">需求成文与方向确认</text><text x="88" y="296" font-size="21" font-weight="400" fill="#65dfe8">planning</text><text x="88" y="336" font-size="24" font-weight="400" fill="#f4f7fb">将想法写成可评审规格</text><text x="88" y="374" font-size="22" font-weight="400" fill="#aab8cc">to-spec · 未决问题才 grilling</text><rect x="612" y="224" width="524" height="178" rx="16" fill="#172233" stroke="#2b3d54"/><text x="636" y="264" font-size="28" font-weight="700" fill="#f4f7fb">拆出可交付任务</text><text x="636" y="296" font-size="21" font-weight="400" fill="#65dfe8">dev-planner</text><text x="636" y="336" font-size="24" font-weight="400" fill="#f4f7fb">先挑战前提，再拆任务</text><text x="636" y="374" font-size="22" font-weight="400" fill="#aab8cc">to-tickets · 顺序与阻塞边</text><text x="64" y="450" font-size="27" font-weight="700" fill="#65dfe8">实施</text><rect x="64" y="478" width="524" height="178" rx="16" fill="#172233" stroke="#2b3d54"/><text x="88" y="518" font-size="28" font-weight="700" fill="#f4f7fb">把批准任务做成代码</text><text x="88" y="550" font-size="21" font-weight="400" fill="#65dfe8">implementation</text><text x="88" y="590" font-size="24" font-weight="400" fill="#f4f7fb">在当前宿主中实现并验证</text><text x="88" y="628" font-size="22" font-weight="400" fill="#aab8cc">implement · TDD · code review</text><rect x="612" y="478" width="524" height="178" rx="16" fill="#172233" stroke="#2b3d54"/><text x="636" y="518" font-size="28" font-weight="700" fill="#f4f7fb">按界面规模做设计</text><text x="636" y="550" font-size="21" font-weight="400" fill="#65dfe8">frontend-design</text><text x="636" y="590" font-size="24" font-weight="400" fill="#f4f7fb">从小修到完整设计按级加载</text><text x="636" y="628" font-size="22" font-weight="400" fill="#aab8cc">Design Read · 分级资源</text><text x="64" y="704" font-size="27" font-weight="700" fill="#65dfe8">质量验证</text><rect x="64" y="732" width="524" height="178" rx="16" fill="#172233" stroke="#2b3d54"/><text x="88" y="772" font-size="28" font-weight="700" fill="#f4f7fb">接口与输入边界校验</text><text x="88" y="804" font-size="21" font-weight="400" fill="#65dfe8">be-validator</text><text x="88" y="844" font-size="24" font-weight="400" fill="#f4f7fb">核对契约，暴露边界问题</text><text x="88" y="882" font-size="22" font-weight="400" fill="#aab8cc">Spectral · 静态契约校验</text><rect x="612" y="732" width="524" height="178" rx="16" fill="#172233" stroke="#2b3d54"/><text x="636" y="772" font-size="28" font-weight="700" fill="#f4f7fb">有范围的安全检查</text><text x="636" y="804" font-size="21" font-weight="400" fill="#65dfe8">security</text><text x="636" y="844" font-size="24" font-weight="400" fill="#f4f7fb">发现漏洞，说明扫描覆盖</text><text x="636" y="882" font-size="22" font-weight="400" fill="#aab8cc">Semgrep · 本地 Python 规则</text><rect x="64" y="928" width="524" height="178" rx="16" fill="#172233" stroke="#2b3d54"/><text x="88" y="968" font-size="28" font-weight="700" fill="#f4f7fb">第三方 Skill 安全检查</text><text x="88" y="1000" font-size="21" font-weight="400" fill="#65dfe8">skill-sentinel</text><text x="88" y="1040" font-size="24" font-weight="400" fill="#f4f7fb">安装前检查威胁与缺失能力</text><text x="88" y="1078" font-size="22" font-weight="400" fill="#aab8cc">Cisco Skill Scanner · 失败关门</text><rect x="612" y="928" width="524" height="178" rx="16" fill="#172233" stroke="#2b3d54"/><text x="636" y="968" font-size="28" font-weight="700" fill="#f4f7fb">规范与需求双重审查</text><text x="636" y="1000" font-size="21" font-weight="400" fill="#65dfe8">review</text><text x="636" y="1040" font-size="24" font-weight="400" fill="#f4f7fb">基于明确版本核查变更</text><text x="636" y="1078" font-size="22" font-weight="400" fill="#aab8cc">固定 base · 可复现发现</text><text x="64" y="1154" font-size="27" font-weight="700" fill="#65dfe8">可选治理</text><rect x="64" y="1182" width="1072" height="178" rx="16" fill="#172233" stroke="#2b3d54"/><text x="88" y="1222" font-size="28" font-weight="700" fill="#f4f7fb">重型发布与迁移治理</text><text x="88" y="1254" font-size="21" font-weight="400" fill="#65dfe8">sdlc</text><text x="88" y="1294" font-size="24" font-weight="400" fill="#f4f7fb">仅在明确批准治理范围时使用</text><text x="88" y="1332" font-size="22" font-weight="400" fill="#aab8cc">显式授权 · 非默认开发路径</text><text x="64" y="1420" font-size="24" font-weight="400" fill="#aab8cc">Decision Core 核对资格与任务条件，宿主消费方法后执行。</text></svg>